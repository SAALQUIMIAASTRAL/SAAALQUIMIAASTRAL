<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Crear nueva contraseña — Sam Alquimia Astral</title>
<style>
  body { font-family: 'Georgia', serif; max-width: 420px; margin: 60px auto; padding: 24px; color: #2D1B4E; background: #FAF6F0; }
  h1 { font-size: 20px; color: #3D2460; text-align: center; }
  p { font-size: 13px; color: #6b5a80; text-align: center; }
  label { font-size: 13px; display: block; margin: 16px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #D9C6EE; font-size: 14px; }
  button { width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 100px; background: #3D2460; color: #fff; font-size: 14px; cursor: pointer; }
  .msg { font-size: 13px; text-align: center; margin-top: 14px; }
  .error { color: #a5442f; background:#fbe6e3; border-radius:10px; padding:10px; }
  .exito { color: #1e6b3c; background:#e1f3e6; border-radius:10px; padding:10px; }
  .aviso { color: #8a6414; background:#fdf2d8; border-radius:10px; padding:10px; }
  .msg:empty { display:none; }
  .msg:not(:empty)::before { display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;margin-right:8px;font-family:Arial,sans-serif;font-weight:bold; }
  .msg.error::before { content:'×';background:#bf3535;color:white; }
  .msg.exito::before { content:'✓';background:#21834b;color:white; }
  .msg.aviso::before { content:'!';background:#efc34d;color:#493400; }
  .campo-pass { margin-bottom: 4px; }
  .campo-pass label { font-size: 13px; display: block; margin: 16px 0 4px; }
  .input-wrap { position: relative; }
  .input-wrap input { width: 100%; box-sizing: border-box; padding: 10px 40px 10px 12px; border-radius: 10px; border: 1px solid #D9C6EE; font-size: 14px; }
  .ojo-toggle { width:auto; margin:0; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 20px; color: #6b5a80; padding: 4px; z-index: 10; line-height: 1; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #D9C6EE; font-size: 14px; }
</style>
</head>
<body>
  <h1>🌙 Crea tu nueva contraseña</h1>
  <p>Escribe tu nueva contraseña para tu cuenta de Sam Alquimia Astral.</p>

  <div id="formulario">
    <div class="campo-pass">
      <label>Nueva contraseña</label>
      <div class="input-wrap">
        <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <button type="button" class="ojo-toggle" onclick="alternarOjo('nueva-password', this)">👁</button>
      </div>
    </div>
    <div class="campo-pass">
      <label>Confirmar nueva contraseña</label>
      <div class="input-wrap">
        <input type="password" id="confirmar-password" placeholder="Repite tu contraseña" autocomplete="new-password">
        <button type="button" class="ojo-toggle" onclick="alternarOjo('confirmar-password', this)">👁</button>
      </div>
    </div>
    <button id="guardar-password" onclick="restablecer()">Guardar nueva contraseña</button>
  </div>
  <div class="msg" id="mensaje" role="status" aria-live="polite"></div>
  <p><a href="/" style="color:#6B4FA0;">Volver a iniciar sesión</a></p>

  <script>
    function alternarOjo(id, boton) {
      const input = document.getElementById(id);
      const oculto = input.type === 'password';
      input.type = oculto ? 'text' : 'password';
      boton.textContent = oculto ? '🙈' : '👁';
    }

    // Mantener la credencial solo en memoria y retirarla del historial/URL visible.
    const parametrosRecuperacion = new URLSearchParams(window.location.hash.slice(1));
    const tokenRecuperacion = parametrosRecuperacion.get('type') === 'recovery' ? parametrosRecuperacion.get('access_token') : null;
    const errorEnlace = parametrosRecuperacion.get('error') || new URLSearchParams(window.location.search).get('error');
    if (window.location.hash || window.location.search) window.history.replaceState(null, '', window.location.pathname);
    function obtenerAccessToken() { return tokenRecuperacion; }
    let restableciendo = false;
    if (!tokenRecuperacion || errorEnlace) {
      document.getElementById('formulario').style.display = 'none';
      const aviso = document.getElementById('mensaje');
      aviso.textContent = 'Este enlace no es válido o ya venció. Vuelve a iniciar sesión y toca ¿Olvidaste tu contraseña? para pedir otro.';
      aviso.className = 'msg aviso';
    }

    // Lee la respuesta como JSON de forma segura — si el servidor devolvió HTML
    // por error (ruta caída, 502/504), no truena con "Unexpected token <".
    async function leerJsonSeguro(r) {
      const texto = await r.text();
      try { return JSON.parse(texto); }
      catch (e) { return { error: 'El servidor no respondió correctamente. Intenta de nuevo en unos segundos.' }; }
    }

    async function restablecer() {
      if (restableciendo) return;
      const msg = document.getElementById('mensaje');
      const access_token = obtenerAccessToken();
      const nueva_password = document.getElementById('nueva-password').value;
      const confirmar_password = document.getElementById('confirmar-password').value;

      if (!access_token) {
        msg.textContent = 'Este enlace no es válido o ya expiró. Solicita uno nuevo desde la app.';
        msg.className = 'msg error';
        return;
      }
      if (!nueva_password || nueva_password.length < 6) {
        msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        msg.className = 'msg error';
        return;
      }
      if (nueva_password !== confirmar_password) {
        msg.textContent = 'Las contraseñas no coinciden. Revísalas e intenta de nuevo.';
        msg.className = 'msg error';
        return;
      }

      restableciendo = true;
      const boton = document.getElementById('guardar-password');
      boton.disabled = true;
      try {
        const r = await fetch('/auth/restablecer-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token, nueva_password }),
        });
        const data = await leerJsonSeguro(r);
        if (!r.ok) {
          msg.textContent = data.error || 'No se pudo actualizar la contraseña.';
          msg.className = 'msg error';
          return;
        }
        document.getElementById('formulario').style.display = 'none';
        msg.textContent = '¡Contraseña actualizada! Ya puedes regresar a la app e iniciar sesión con tu nueva contraseña.';
        msg.className = 'msg exito';
        document.getElementById('nueva-password').value = '';
        document.getElementById('confirmar-password').value = '';
      } catch (e) {
        msg.textContent = 'No se pudo conectar. Intenta guardar de nuevo.';
        msg.className = 'msg error';
      } finally {
        restableciendo = false;
        boton.disabled = false;
      }
    }
  </script>
</body>
</html>
